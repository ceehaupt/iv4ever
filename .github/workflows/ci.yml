name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit-Tests (Simulation, Relay, Doku aktuell)
        run: npm test
      - name: Typecheck und Build
        run: npm run build
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Oberflächen-, Online- und Determinismus-Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
